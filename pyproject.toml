[project]
name = "repl-nix-workspace"
version = "0.2.0"
description = "Hybrid ELT orders pipeline with Python Batch, PySpark, MongoDB, ESR Indexes, Aggregations, Materialized Views, and Unified FastAPI"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.17.0",
    "pytest>=9.1.1",
    "pyspark>=3.5,<4",
    "pymupdf>=1.28.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
]
