# ===========================================================================
# Spark Standalone Cluster + MongoDB — Docker Compose
# ===========================================================================
#
# يشغّل كلاستر Spark كامل (Master + 2 Workers) مع قاعدة MongoDB،
# ويوفّر مجلداً مشتركاً (shared volume) لملفات البيانات والمشروع.
#
# التشغيل:
#   docker compose -f cluster/docker-compose.yml up -d
#
# الإيقاف:
#   docker compose -f cluster/docker-compose.yml down
#
# واجهة Spark Master UI:
#   http://localhost:8080
#
# ===========================================================================

services:
  # -----------------------------------------------------------------------
  # MongoDB — قاعدة البيانات المشتركة (يمكن الوصول إليها من جميع العقد)
  # -----------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: spark-cluster-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Spark Master — العقدة الرئيسية (spark://spark-master:7077)
  # -----------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"   # Spark Master port
      - "8080:8080"   # Spark Master Web UI
      - "4040:4040"   # Spark Application UI (Driver)
    volumes:
      - ../data:/opt/bitnami/spark/pipeline-data:ro
      - ../jars:/opt/bitnami/spark/pipeline-jars:ro
      - ../src:/opt/bitnami/spark/pipeline-src:ro
      - ../config:/opt/bitnami/spark/pipeline-config:ro
      - spark_logs:/opt/bitnami/spark/logs
    networks:
      - spark-network
    depends_on:
      mongodb:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # Spark Worker 1 — عقدة عمل أولى
  # -----------------------------------------------------------------------
  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"   # Worker 1 Web UI
    volumes:
      - ../data:/opt/bitnami/spark/pipeline-data:ro
      - ../jars:/opt/bitnami/spark/pipeline-jars:ro
      - ../src:/opt/bitnami/spark/pipeline-src:ro
      - ../config:/opt/bitnami/spark/pipeline-config:ro
    networks:
      - spark-network
    depends_on:
      - spark-master

  # -----------------------------------------------------------------------
  # Spark Worker 2 — عقدة عمل ثانية
  # -----------------------------------------------------------------------
  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8082"   # Worker 2 Web UI
    volumes:
      - ../data:/opt/bitnami/spark/pipeline-data:ro
      - ../jars:/opt/bitnami/spark/pipeline-jars:ro
      - ../src:/opt/bitnami/spark/pipeline-src:ro
      - ../config:/opt/bitnami/spark/pipeline-config:ro
    networks:
      - spark-network
    depends_on:
      - spark-master

networks:
  spark-network:
    driver: bridge

volumes:
  mongodb_data:
  spark_logs:
