# ===========================================================================
# spark-defaults.conf — إعدادات Spark الافتراضية للكلاستر الموزع
# ===========================================================================

# --- Master ---
spark.master                              spark://spark-master:7077

# --- Application ---
spark.app.name                            hybrid-orders-pipeline
spark.submit.deployMode                   client

# --- Memory ---
spark.driver.memory                       2g
spark.executor.memory                     2g
spark.executor.cores                      2

# --- MongoDB Connector ---
spark.jars                                /opt/bitnami/spark/pipeline-jars/mongo-spark-connector_2.13-10.4.0.jar,/opt/bitnami/spark/pipeline-jars/bson-4.8.2.jar,/opt/bitnami/spark/pipeline-jars/bson-record-codec-4.8.2.jar,/opt/bitnami/spark/pipeline-jars/mongodb-driver-core-4.8.2.jar,/opt/bitnami/spark/pipeline-jars/mongodb-driver-sync-4.8.2.jar
spark.mongodb.read.connection.uri         mongodb://spark-cluster-mongodb:27017/orders_pipeline.orders_raw
spark.mongodb.write.connection.uri        mongodb://spark-cluster-mongodb:27017/orders_pipeline

# --- Serialization ---
spark.serializer                          org.apache.spark.serializer.KryoSerializer

# --- UI ---
spark.ui.port                             4040
spark.ui.showConsoleProgress              true

# --- Network ---
spark.network.timeout                     600s
spark.rpc.askTimeout                      300s
